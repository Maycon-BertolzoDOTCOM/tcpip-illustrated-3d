<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3DGS Splat — Three-Way Handshake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e17; color: #e0e6ed; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
.scene-info { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(15,22,41,0.92); border: 1px solid #1e2940; border-radius: 14px; padding: 14px 24px; text-align: center; z-index: 10; max-width: 520px; backdrop-filter: blur(8px); }
.scene-info h2 { font-size: 1rem; font-weight: 600; color: #60a5fa; }
.scene-info p { font-size: 0.8rem; color: #8899b0; margin-top: 2px; }
.scene-info .badge { display: inline-block; margin-top: 4px; padding: 2px 10px; background: #1e2940; border-radius: 6px; font-size: 0.7rem; color: #34d399; }
.back-link { position: fixed; top: 20px; left: 20px; z-index: 10; color: #5a6a80; text-decoration: none; font-size: 0.85rem; padding: 6px 14px; border: 1px solid #1e2940; border-radius: 8px; transition: 0.2s; background: rgba(10,14,23,0.8); backdrop-filter: blur(4px); }
.back-link:hover { border-color: #3b4b6b; color: #e0e6ed; }
</style>
<script type="importmap">
{ "imports": {
    "three": "../../vendor/three/three.module.js",
    "three/addons/": "../../vendor/three/addons/"
} }
</script>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; All Scenes</a>
<div id="canvas-wrap" style="width:100vw;height:100vh"></div>
<div class="scene-info">
  <h2>3D Gaussian Splat — Handshake</h2>
  <p>Procedural point cloud • Navigable 3D • 1,040 points</p>
  <div class="badge">✦ arraste para girar • scroll para zoom ✦</div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.1, 50);
camera.position.set(0, 3, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
wrap.appendChild(renderer.domElement);

scene.background = new THREE.Color(0x0a0e17);
scene.fog = new THREE.Fog(0x0a0e17, 15, 30);

const ambient = new THREE.AmbientLight(0x4466aa, 0.5);
scene.add(ambient);
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(5, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-4, 2, -3);
scene.add(fill);

async function loadPLY(url) {
  const resp = await fetch(url);
  const buf = await resp.arrayBuffer();
  const headerBytes = new Uint8Array(buf, 0, Math.min(300, buf.byteLength));
  const header = new TextDecoder().decode(headerBytes);
  const match = header.match(/element vertex (\d+)/);
  if (!match) throw new Error('Could not find vertex count in PLY header');
  const count = parseInt(match[1]);
  const endIdx = header.indexOf('end_header');
  const dataStart = endIdx + 11 + (header.charCodeAt(endIdx + 10) === 10 ? 0 : 0);
  const data = new Uint8Array(buf, dataStart + 1);
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const off = i * 15;
    const view = new DataView(data.buffer, data.byteOffset + off, 12);
    pos[i * 3] = view.getFloat32(0, true);
    pos[i * 3 + 1] = view.getFloat32(4, true);
    pos[i * 3 + 2] = view.getFloat32(8, true);
    col[i * 3] = data[off + 12] / 255;
    col[i * 3 + 1] = data[off + 13] / 255;
    col[i * 3 + 2] = data[off + 14] / 255;
  }
  return { pos, col, count };
}

const geo = new THREE.BufferGeometry();
const points = new THREE.Points(
  geo,
  new THREE.PointsMaterial({ size: 0.08, vertexColors: true, sizeAttenuation: true, transparent: true, opacity: 0.95 })
);
scene.add(points);

loadPLY('./scene.ply').then(({ pos, col, count }) => {
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
});

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 3;
controls.maxDistance = 25;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0, 0.3, 0);

let resumeTimeout = null;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(resumeTimeout); });
controls.addEventListener('end', () => { resumeTimeout = setTimeout(() => { controls.autoRotate = true; }, 3000); });

function animate() {
  requestAnimationFrame(animate);
  if (points.geometry.attributes.position) {
    const t = Date.now() * 0.001;
    const p = points.geometry.attributes.position;
    const arr = p.array;
    for (let i = 0; i < p.count; i++) {
      const baseY = i < 20 ? 0.3 : (i < 40 ? -0.1 : 0);
      arr[i * 3 + 1] += Math.sin(t * 2 + i * 0.5) * 0.0005;
    }
    p.needsUpdate = true;
  }
  controls.update();
  renderer.render(scene, camera);
}

new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) animate(); });
}, { threshold: 0.1 }).observe(wrap);

new ResizeObserver(() => {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}).observe(wrap);
</script>
</body>
</html>
