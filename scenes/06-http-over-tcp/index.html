<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTTP over TCP — TCP/IP Illustrated 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e17; color: #e0e6ed; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
.scene-info { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(15,22,41,0.92); border: 1px solid #1e2940; border-radius: 14px; padding: 14px 24px; text-align: center; z-index: 10; max-width: 560px; backdrop-filter: blur(8px); }
.scene-info h2 { font-size: 1rem; font-weight: 600; color: #60a5fa; }
.scene-info p { font-size: 0.8rem; color: #8899b0; margin-top: 2px; }
.scene-info .legend { display: flex; gap: 16px; justify-content: center; margin-top: 6px; font-size: 0.75rem; flex-wrap: wrap; }
.back-link { position: fixed; top: 20px; left: 20px; z-index: 10; color: #5a6a80; text-decoration: none; font-size: 0.85rem; padding: 6px 14px; border: 1px solid #1e2940; border-radius: 8px; transition: 0.2s; background: rgba(10,14,23,0.8); backdrop-filter: blur(4px); }
.back-link:hover { border-color: #3b4b6b; color: #e0e6ed; }
</style>
<script type="importmap">
{ "imports": {
    "three": "../../vendor/three/three.module.js",
    "three/addons/": "../../vendor/three/addons/"
} }
</script>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; All Scenes</a>
<div id="canvas-wrap" style="width:100vw;height:100vh"></div>
<div class="scene-info">
  <h2>HTTP over TCP</h2>
  <p>Connection &rarr; HTTP GET &rarr; Server processes &rarr; HTTP 200 OK with page</p>
  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:#60a5fa"></span> HTTP Request</span>
    <span class="legend-item"><span class="legend-dot" style="background:#34d399"></span> HTTP Response</span>
    <span class="legend-item"><span class="legend-dot" style="background:#fbbf24"></span> TCP Handshake</span>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, wrap.clientWidth / wrap.clientHeight, 0.1, 50);
camera.position.set(0, 3, 11);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
wrap.appendChild(renderer.domElement);

scene.background = new THREE.Color(0x0a0e17);

const ambient = new THREE.AmbientLight(0x4466aa, 0.5);
scene.add(ambient);
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(5, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-4, 2, -3);
scene.add(fill);

function makeStation(x, color, label, isServer) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 0.8, 0.6),
    new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.6 })
  );
  body.position.y = 0.4;
  g.add(body);
  if (isServer) {
    for (let i = 0; i < 3; i++) {
      const led = new THREE.Mesh(
        new THREE.SphereGeometry(0.04, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0x34d399 })
      );
      led.position.set(-0.4 + i * 0.4, 0.7, 0.32);
      g.add(led);
    }
  }
  const screen = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 0.5, 0.05),
    new THREE.MeshStandardMaterial({ color: 0x1a2a4a, emissive: 0x0a1a3a, emissiveIntensity: 0.3 })
  );
  screen.position.set(0, 0.4, 0.33);
  g.add(screen);
  g.position.x = x;
  scene.add(g);
  return g;
}

const browser = makeStation(-5, 0x3b82f6, 'Browser', false);
const server = makeStation(5, 0x8b5cf6, 'Server', true);

const line = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 0.04),
  new THREE.MeshBasicMaterial({ color: 0x1e2940, transparent: true, opacity: 0.2, side: THREE.DoubleSide })
);
line.rotation.x = -Math.PI / 2;
line.position.set(0, 0.15, 0);
scene.add(line);

function makePacket(color, size, box) {
  const g = new THREE.Group();
  if (box) {
    const core = new THREE.Mesh(
      new THREE.BoxGeometry(size || 0.3, (size || 0.3) * 0.6, (size || 0.3) * 0.4),
      new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.15, roughness: 0.2, metalness: 0.1 })
    );
    g.add(core);
  } else {
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(size || 0.15, 12, 12),
      new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.2, roughness: 0.2, metalness: 0.1 })
    );
    g.add(sphere);
  }
  return g;
}

const handshakePackets = [makePacket(0xfbbf24), makePacket(0xfbbf24), makePacket(0xfbbf24)];
const httpRequest = makePacket(0x60a5fa, 0.35, true);
const httpResponse = makePacket(0x34d399, 0.45, true);

const allPackets = [...handshakePackets, httpRequest, httpResponse];
allPackets.forEach(p => { p.visible = false; scene.add(p); });

function pFrom(t) { return new THREE.Vector3(-5 + 10 * t, 0.2 + Math.sin(t * Math.PI) * 0.2, 0); }

const phaseDuration = 1.2;
const pauseDuration = 0.6;

let clock = new THREE.Clock();
let mainPhase = 0;
let phaseTime = 0;
let cycleCount = 0;

function updateCycle(delta) {
  phaseTime += delta;
  const totalStep = phaseDuration + pauseDuration;

  allPackets.forEach(p => p.visible = false);

  if (mainPhase < 3) {
    if (phaseTime < phaseDuration) {
      const t = phaseTime / phaseDuration;
      allPackets[mainPhase].visible = true;
      const fromX = mainPhase === 0 ? -5 : (mainPhase === 1 ? 5 : -5);
      const toX = mainPhase === 0 ? 5 : (mainPhase === 1 ? -5 : 5);
      const p = allPackets[mainPhase];
      p.position.x = fromX + (toX - fromX) * t;
      p.position.y = 0.2 + Math.sin(t * Math.PI) * 0.3;
      p.position.z = 0;
      p.scale.setScalar(1 + Math.sin(t * Math.PI * 2) * 0.08);
    } else if (phaseTime >= totalStep) {
      mainPhase++;
      phaseTime = 0;
    }
  } else if (mainPhase === 3) {
    if (phaseTime < phaseDuration * 1.2) {
      const t = phaseTime / (phaseDuration * 1.2);
      httpRequest.visible = true;
      httpRequest.position.copy(pFrom(t));
      httpRequest.scale.setScalar(1 + Math.sin(t * Math.PI * 2) * 0.06);
    } else if (phaseTime >= phaseDuration * 1.2 + pauseDuration) {
      mainPhase = 4;
      phaseTime = 0;
    }
  } else if (mainPhase === 4) {
    if (phaseTime < pauseDuration * 0.5) {
    } else {
      const t = Math.min((phaseTime - pauseDuration * 0.5) / (phaseDuration * 1.5), 1);
      httpResponse.visible = true;
      httpResponse.position.x = 5 - 10 * t;
      httpResponse.position.y = 0.2 + Math.sin(t * Math.PI) * 0.25 + 0.15;
      httpResponse.position.z = 0;
      httpResponse.scale.setScalar(1 + Math.sin(t * Math.PI * 2) * 0.05);
    }
    if (phaseTime >= totalStep * 1.5) {
      cycleCount++;
      mainPhase = 0;
      phaseTime = 0;
    }
  }
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 20;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.target.set(0, 0.3, 0);

let resumeTimeout = null;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(resumeTimeout); });
controls.addEventListener('end', () => { resumeTimeout = setTimeout(() => { controls.autoRotate = true; }, 3000); });

let rafId = null;
function animate() {
  rafId = requestAnimationFrame(animate);
  updateCycle(clock.getDelta());
  controls.update();
  renderer.render(scene, camera);
}

new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting && rafId === null) { clock = new THREE.Clock(); animate(); }
    else if (!e.isIntersecting && rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
  });
}, { threshold: 0.1 }).observe(wrap);

new ResizeObserver(() => {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}).observe(wrap);

animate();
</script>
</body>
</html>
