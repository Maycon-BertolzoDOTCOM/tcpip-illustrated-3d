<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP Fragmentation — TCP/IP Illustrated 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e17; color: #e0e6ed; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
.scene-info { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(15,22,41,0.92); border: 1px solid #1e2940; border-radius: 14px; padding: 14px 24px; text-align: center; z-index: 10; max-width: 520px; backdrop-filter: blur(8px); }
.scene-info h2 { font-size: 1rem; font-weight: 600; color: #34d399; }
.scene-info p { font-size: 0.8rem; color: #8899b0; margin-top: 2px; }
.scene-info .legend { display: flex; gap: 16px; justify-content: center; margin-top: 6px; font-size: 0.75rem; }
.back-link { position: fixed; top: 20px; left: 20px; z-index: 10; color: #5a6a80; text-decoration: none; font-size: 0.85rem; padding: 6px 14px; border: 1px solid #1e2940; border-radius: 8px; transition: 0.2s; background: rgba(10,14,23,0.8); backdrop-filter: blur(4px); }
.back-link:hover { border-color: #3b4b6b; color: #e0e6ed; }
</style>
<script type="importmap">
{ "imports": {
    "three": "../../vendor/three/three.module.js",
    "three/addons/": "../../vendor/three/addons/"
} }
</script>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; All Scenes</a>
<div id="canvas-wrap" style="width:100vw;height:100vh"></div>
<div class="scene-info">
  <h2>IP Fragmentation</h2>
  <p>Large packet splits into fragments, travels across MTU boundaries, reassembles</p>
  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:#60a5fa"></span> Original</span>
    <span class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span> Fragment 1</span>
    <span class="legend-item"><span class="legend-dot" style="background:#f97316"></span> Fragment 2</span>
    <span class="legend-item"><span class="legend-dot" style="background:#ef4444"></span> Fragment 3</span>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, wrap.clientWidth / wrap.clientHeight, 0.1, 50);
camera.position.set(0, 3, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
wrap.appendChild(renderer.domElement);

scene.background = new THREE.Color(0x0a0e17);
scene.fog = new THREE.Fog(0x0a0e17, 15, 30);

const ambient = new THREE.AmbientLight(0x4466aa, 0.5);
scene.add(ambient);
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(5, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-4, 2, -3);
scene.add(fill);

function makeHost(x, color) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.0, 0.7, 0.5),
    new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.6 })
  );
  body.position.y = 0.35;
  group.add(body);
  const stand = new THREE.Mesh(
    new THREE.BoxGeometry(0.08, 0.25, 0.08),
    new THREE.MeshStandardMaterial({ color: 0x2a3a5a })
  );
  stand.position.y = -0.12;
  group.add(stand);
  group.position.x = x;
  scene.add(group);
  return group;
}

const hostA = makeHost(-5.5, 0x3b82f6);
const hostB = makeHost(5.5, 0x8b5cf6);

const routerPos = new THREE.Vector3(0, 0, 0);
const routerBody = new THREE.Mesh(
  new THREE.OctahedronGeometry(0.5),
  new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xef4444, emissiveIntensity: 0.1, roughness: 0.4, metalness: 0.3 })
);
routerBody.position.copy(routerPos);
scene.add(routerBody);
const routerLabel = new THREE.Mesh(
  new THREE.BoxGeometry(0.6, 0.08, 0.3),
  new THREE.MeshBasicMaterial({ color: 0x1e2940, transparent: true, opacity: 0.6 })
);
routerLabel.position.set(0, 0.7, 0);
scene.add(routerLabel);
const routerRing = new THREE.Mesh(
  new THREE.RingGeometry(0.6, 0.65, 32),
  new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.2, side: THREE.DoubleSide })
);
routerRing.position.set(0, 0, 0);

const mtuLine = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 0.03),
  new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.15, side: THREE.DoubleSide })
);
mtuLine.rotation.x = -Math.PI / 2;
mtuLine.position.set(0, -0.1, 0);
scene.add(mtuLine);

function makeBigPacket(color) {
  const group = new THREE.Group();
  const core = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.4, 0.4),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.15, roughness: 0.3, metalness: 0.2 })
  );
  group.add(core);
  const glow = new THREE.Mesh(
    new THREE.BoxGeometry(0.7, 0.5, 0.5),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.08 })
  );
  group.add(glow);
  return group;
}

function makeFragment(color, size) {
  const group = new THREE.Group();
  const core = new THREE.Mesh(
    new THREE.BoxGeometry(size, size * 0.5, size * 0.5),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.2, roughness: 0.3, metalness: 0.1 })
  );
  core.position.x = -0.1;
  group.add(core);
  return group;
}

const bigPacket = makeBigPacket(0x60a5fa);
bigPacket.position.set(-5.5, 0.2, 0);
scene.add(bigPacket);

const frag1 = makeFragment(0xf59e0b, 0.35);
const frag2 = makeFragment(0xf97316, 0.30);
const frag3 = makeFragment(0xef4444, 0.25);
frag1.position.set(-5.5, 0.2, 0);
frag2.position.set(-5.5, 0.2, 0);
frag3.position.set(-5.5, 0.2, 0);
frag1.visible = false;
frag2.visible = false;
frag3.visible = false;
scene.add(frag1);
scene.add(frag2);
scene.add(frag3);

function makeConnLine(xFrom, xTo, y) {
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(Math.abs(xTo - xFrom), 0.03),
    new THREE.MeshBasicMaterial({ color: 0x1e2940, transparent: true, opacity: 0.2, side: THREE.DoubleSide })
  );
  line.rotation.x = -Math.PI / 2;
  line.position.set((xFrom + xTo) / 2, y, 0);
  scene.add(line);
  return line;
}

const connLeft = makeConnLine(-5.5, 0, 0.1);
const connRight = makeConnLine(0, 5.5, 0.1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 20;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.target.set(0, 0.3, 0);

let resumeTimeout = null;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(resumeTimeout); });
controls.addEventListener('end', () => { resumeTimeout = setTimeout(() => { controls.autoRotate = true; }, 3000); });

let clock = new THREE.Clock();
let phase = 0;
let phaseTime = 0;

function easeInOut(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

function updatePhase(delta) {
  phaseTime += delta;
  const dur = 2.0;
  const pause = 1.2;

  if (phase === 0) {
    const t = phaseTime / dur;
    if (t >= 1) {
      phase = 1;
      phaseTime = 0;
    } else {
      bigPacket.position.x = -5.5 + 5.5 * easeInOut(t);
      bigPacket.position.y = 0.2 + Math.sin(t * Math.PI) * 0.1;
    }
  } else if (phase === 1) {
    if (phaseTime < pause * 0.5) {
      bigPacket.position.set(0, 0.2, 0);
      bigPacket.visible = true;
    } else {
      bigPacket.visible = false;
      frag1.visible = true;
      frag2.visible = true;
      frag3.visible = true;
      const s = Math.min(phaseTime / pause, 1);
      frag1.position.set(0, 0.2 + Math.sin(s * Math.PI) * 0.15, 0.3 * s);
      frag2.position.set(0, 0.2 + Math.sin(s * Math.PI + 0.5) * 0.1, 0);
      frag3.position.set(0, 0.2 + Math.sin(s * Math.PI + 1) * 0.1, -0.3 * s);
      frag1.scale.setScalar(0.5 + s * 0.5);
      frag2.scale.setScalar(0.5 + s * 0.5);
      frag3.scale.setScalar(0.5 + s * 0.5);
      if (phaseTime >= pause) {
        phase = 2;
        phaseTime = 0;
      }
    }
  } else if (phase === 2) {
    const t = phaseTime / dur;
    if (t >= 1) {
      phase = 3;
      phaseTime = 0;
    } else {
      const et = easeInOut(t);
      frag1.position.x = 5.5 * et;
      frag2.position.x = 5.5 * et;
      frag3.position.x = 5.5 * et;
      frag1.position.y = 0.3 + Math.sin(t * Math.PI * 2) * 0.08;
      frag2.position.y = 0.15 + Math.sin(t * Math.PI * 2 + 1) * 0.06;
      frag3.position.y = 0.1 + Math.sin(t * Math.PI * 2 + 2) * 0.05;
      frag1.position.z = 0.3 * (1 - t);
      frag2.position.z = 0;
      frag3.position.z = -0.3 * (1 - t);
    }
  } else if (phase === 3) {
    const s = Math.min(phaseTime / pause, 1);
    const inv = 1 - s;
    frag1.position.x = 5.5;
    frag2.position.x = 5.5;
    frag3.position.x = 5.5;
    frag1.position.set(5.5, 0.2 + inv * 0.1, 0);
    frag2.position.set(5.5 + inv * 0.1, 0.2 + inv * 0.1, 0);
    frag3.position.set(5.5 + inv * 0.2, 0.2 + inv * 0.1, 0);
    frag1.scale.setScalar(0.5 + inv * 0.5);
    frag2.scale.setScalar(0.5 + inv * 0.5);
    frag3.scale.setScalar(0.5 + inv * 0.5);

    if (s >= 1) {
      frag1.visible = false;
      frag2.visible = false;
      frag3.visible = false;
      bigPacket.visible = true;
      bigPacket.position.set(5.5, 0.2, 0);
      bigPacket.scale.setScalar(1);
      if (phaseTime > pause + 1.0) {
        phase = 0;
        phaseTime = 0;
        frag1.visible = false;
        frag2.visible = false;
        frag3.visible = false;
        bigPacket.visible = true;
        bigPacket.position.set(-5.5, 0.2, 0);
        bigPacket.scale.setScalar(1);
      }
    }
  }
}

let rafId = null;
function animate() {
  rafId = requestAnimationFrame(animate);
  const delta = clock.getDelta();
  updatePhase(delta);
  controls.update();
  renderer.render(scene, camera);
}

new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting && rafId === null) { clock = new THREE.Clock(); animate(); }
    else if (!e.isIntersecting && rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
  });
}, { threshold: 0.1 }).observe(wrap);

new ResizeObserver(() => {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}).observe(wrap);

animate();
</script>
</body>
</html>
