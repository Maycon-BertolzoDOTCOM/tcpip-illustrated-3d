<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARP Protocol — TCP/IP Illustrated 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e17; color: #e0e6ed; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
.scene-info { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(15,22,41,0.92); border: 1px solid #1e2940; border-radius: 14px; padding: 14px 24px; text-align: center; z-index: 10; max-width: 520px; backdrop-filter: blur(8px); }
.scene-info h2 { font-size: 1rem; font-weight: 600; color: #f59e0b; }
.scene-info p { font-size: 0.8rem; color: #8899b0; margin-top: 2px; }
.scene-info .legend { display: flex; gap: 16px; justify-content: center; margin-top: 6px; font-size: 0.75rem; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.back-link { position: fixed; top: 20px; left: 20px; z-index: 10; color: #5a6a80; text-decoration: none; font-size: 0.85rem; padding: 6px 14px; border: 1px solid #1e2940; border-radius: 8px; transition: 0.2s; background: rgba(10,14,23,0.8); backdrop-filter: blur(4px); }
.back-link:hover { border-color: #3b4b6b; color: #e0e6ed; }
</style>
<script type="importmap">
{ "imports": {
    "three": "../../vendor/three/three.module.js",
    "three/addons/": "../../vendor/three/addons/"
} }
</script>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; All Scenes</a>
<div id="canvas-wrap" style="width:100vw;height:100vh"></div>
<div class="scene-info">
  <h2>ARP — Address Resolution Protocol</h2>
  <p>Who has IP 192.168.1.3? &rarr; Broadcast &rarr; I do, my MAC is AA:BB:CC:DD:EE:FF</p>
  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:#fbbf24"></span> ARP Request (Broadcast)</span>
    <span class="legend-item"><span class="legend-dot" style="background:#34d399"></span> ARP Reply (Unicast)</span>
    <span class="legend-item"><span class="legend-dot" style="background:#60a5fa"></span> Data Flow</span>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, wrap.clientWidth / wrap.clientHeight, 0.1, 50);
camera.position.set(0, 5, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
wrap.appendChild(renderer.domElement);

scene.background = new THREE.Color(0x0a0e17);
scene.fog = new THREE.Fog(0x0a0e17, 15, 30);

const ambient = new THREE.AmbientLight(0x4466aa, 0.5);
scene.add(ambient);
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(5, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-4, 2, -3);
scene.add(fill);

const busPositions = [-5, 0, 5];
const busColors = [0x3b82f6, 0x8b5cf6, 0xec4899];
const busLabels = ['Host A\n192.168.1.1\nAA:BB:CC:11:22:01', 'Host B\n192.168.1.2\nAA:BB:CC:11:22:02', 'Host C\n192.168.1.3\nAA:BB:CC:11:22:03'];

function makeHost(x, color, label) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.0, 0.7, 0.5),
    new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.6, emissive: color, emissiveIntensity: 0.05 })
  );
  body.position.y = 0.35;
  group.add(body);
  const screen = new THREE.Mesh(
    new THREE.BoxGeometry(0.7, 0.4, 0.04),
    new THREE.MeshStandardMaterial({ color: 0x1a2a4a, emissive: 0x0a1a3a, emissiveIntensity: 0.3 })
  );
  screen.position.set(0, 0.35, 0.27);
  group.add(screen);
  const stand = new THREE.Mesh(
    new THREE.BoxGeometry(0.08, 0.25, 0.08),
    new THREE.MeshStandardMaterial({ color: 0x2a3a5a })
  );
  stand.position.y = -0.12;
  group.add(stand);
  group.position.x = x;
  scene.add(group);
  return group;
}

const hosts = busPositions.map((x, i) => makeHost(x, busColors[i], busLabels[i]));

const busBar = new THREE.Mesh(
  new THREE.CylinderGeometry(0.04, 0.04, 12, 8),
  new THREE.MeshStandardMaterial({ color: 0x2a3a5a, transparent: true, opacity: 0.4 })
);
busBar.rotation.z = Math.PI / 2;
busBar.position.y = 0.05;
scene.add(busBar);

const busEndpoints = [];
[-6, 6].forEach(x => {
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.06, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0x3a4a6a })
  );
  dot.position.set(x, 0.05, 0);
  scene.add(dot);
  busEndpoints.push(dot);
});

function makePacket(color, size) {
  const group = new THREE.Group();
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(size || 0.18, 12, 12),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4, roughness: 0.2, metalness: 0.1 })
  );
  group.add(core);
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry((size || 0.18) * 1.4, 10, 10),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.12 })
  );
  group.add(glow);
  return group;
}

const requestPacket = makePacket(0xfbbf24);
const replyPacket = makePacket(0x34d399);
const dataStream = makePacket(0x60a5fa, 0.22);

requestPacket.position.set(-5, 0.5, 0);
requestPacket.visible = false;
replyPacket.position.set(5, 0.5, 0);
replyPacket.visible = false;
dataStream.position.set(-5, 0.5, 0);
dataStream.visible = false;
scene.add(requestPacket);
scene.add(replyPacket);
scene.add(dataStream);

const broadcastRing = new THREE.Mesh(
  new THREE.RingGeometry(0.3, 0.35, 48),
  new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0, side: THREE.DoubleSide })
);
broadcastRing.position.set(-5, 0.3, 0);
broadcastRing.rotation.x = -Math.PI / 2;
scene.add(broadcastRing);

const ring2 = broadcastRing.clone();
ring2.position.set(0, 0.3, 0);
ring2.material = broadcastRing.material.clone();
scene.add(ring2);

const ring3 = broadcastRing.clone();
ring3.position.set(5, 0.3, 0);
ring3.material = broadcastRing.material.clone();
scene.add(ring3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 5;
controls.maxDistance = 25;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.target.set(0, 0.3, 0);

let resumeTimeout = null;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(resumeTimeout); });
controls.addEventListener('end', () => { resumeTimeout = setTimeout(() => { controls.autoRotate = true; }, 3000); });

let clock = new THREE.Clock();
let phase = 0;
let phaseTime = 0;

function easeInOut(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

function updatePhase(delta) {
  phaseTime += delta;
  const dur = 1.8;
  const pause = 1.0;

  if (phase === 0) {
    requestPacket.visible = true;
    replyPacket.visible = false;
    dataStream.visible = false;
    const t = phaseTime / dur;
    if (t >= 1) {
      requestPacket.position.set(5, 0.4, 0);
      phase = 1;
      phaseTime = 0;
    } else {
      requestPacket.position.x = -5 + 10 * easeInOut(t);
      requestPacket.position.y = 0.4 + Math.sin(t * Math.PI) * 0.3;
      const ringScale = 1 + easeInOut(t) * 3;
      broadcastRing.scale.setScalar(ringScale);
      broadcastRing.material.opacity = 0.15 * (1 - easeInOut(t) * 0.7);
      ring2.scale.setScalar(Math.max(0, ringScale - 1.5));
      ring2.material.opacity = broadcastRing.material.opacity * 0.5;
      ring3.scale.setScalar(Math.max(0, ringScale - 3));
      ring3.material.opacity = broadcastRing.material.opacity * 0.25;
    }
  } else if (phase === 1) {
    if (phaseTime < pause) {
      requestPacket.position.set(5, 0.4, 0);
      hostCGlow(0.3 + Math.sin(phaseTime * 6) * 0.2);
    } else {
      hostCGlow(0.8);
      replyPacket.visible = true;
      const t = (phaseTime - pause) / dur;
      if (t >= 1) {
        replyPacket.position.set(-5, 0.4, 0);
        phase = 2;
        phaseTime = 0;
      } else {
        replyPacket.position.x = 5 - 10 * easeInOut(t);
        replyPacket.position.y = 0.4 + Math.sin(t * Math.PI) * 0.2;
      }
    }
  } else if (phase === 2) {
    if (phaseTime < pause * 0.6) {
      replyPacket.position.set(-5, 0.4, 0);
      hostCGlow(0.3 + Math.sin(phaseTime * 4) * 0.1);
      requestPacket.visible = false;
    } else {
      hostCGlow(0.05);
      requestPacket.visible = false;
      replyPacket.visible = false;
      dataStream.visible = true;
      const t = (phaseTime - pause * 0.6) / (dur * 0.6);
      if (t >= 1) {
        dataStream.position.set(5, 0.4, 0);
        dataStreamTrail.visible = true;
        if (phaseTime > pause * 0.6 + dur * 0.6 + pause * 0.8) {
          phase = 0;
          phaseTime = 0;
          requestPacket.visible = false;
          replyPacket.visible = false;
          dataStream.visible = false;
          dataStreamTrail.visible = false;
          dataStream.position.set(-5, 0.4, 0);
          requestPacket.position.set(-5, 0.5, 0);
          replyPacket.position.set(5, 0.5, 0);
          broadcastRing.material.opacity = 0;
          broadcastRing.scale.setScalar(1);
          ring2.material.opacity = 0;
          ring2.scale.setScalar(1);
          ring3.material.opacity = 0;
          ring3.scale.setScalar(1);
          hostCGlow(0.05);
        }
      } else {
        dataStream.position.x = -5 + 10 * easeInOut(t);
        dataStream.position.y = 0.4 + Math.sin(t * Math.PI * 3) * 0.15;
        dataStream.scale.setScalar(1 + Math.sin(t * Math.PI * 6) * 0.1);
        updateDataTrail(t);
      }
    }
  }
}

let dataStreamTrail = new THREE.Mesh(
  new THREE.PlaneGeometry(0.02, 0.02),
  new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.0, side: THREE.DoubleSide })
);
dataStreamTrail.rotation.x = -Math.PI / 2;
dataStreamTrail.visible = false;
scene.add(dataStreamTrail);

const trailHistory = [];
function updateDataTrail(t) {
  trailHistory.push({ x: dataStream.position.x, y: dataStream.position.y, time: phaseTime });
  if (trailHistory.length > 30) trailHistory.shift();
}

let trailMesh = new THREE.Mesh(
  new THREE.BufferGeometry(),
  new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.15, side: THREE.DoubleSide })
);
scene.add(trailMesh);

function hostCGlow(intensity) {
  const body = hosts[2].children[0];
  if (body.material) {
    body.material.emissiveIntensity = intensity;
  }
}

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  updatePhase(delta);

  if (trailHistory.length > 2) {
    const positions = [];
    trailHistory.forEach(p => {
      positions.push(p.x, 0.05, 0);
    });
    trailMesh.geometry.dispose();
    trailMesh.geometry = new THREE.BufferGeometry();
    trailMesh.geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    trailMesh.geometry.setDrawRange(0, trailHistory.length);
  }

  controls.update();
  renderer.render(scene, camera);
}

new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) { clock = new THREE.Clock(); animate(); }
  });
}, { threshold: 0.1 }).observe(wrap);

new ResizeObserver(() => {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}).observe(wrap);
</script>
</body>
</html>
