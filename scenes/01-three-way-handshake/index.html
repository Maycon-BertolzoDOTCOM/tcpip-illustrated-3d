<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three-Way Handshake — TCP/IP Illustrated 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e17; color: #e0e6ed; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
.scene-info { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(15,22,41,0.92); border: 1px solid #1e2940; border-radius: 14px; padding: 14px 24px; text-align: center; z-index: 10; max-width: 500px; backdrop-filter: blur(8px); }
.scene-info h2 { font-size: 1rem; font-weight: 600; color: #60a5fa; }
.scene-info p { font-size: 0.8rem; color: #8899b0; margin-top: 2px; }
.scene-info .legend { display: flex; gap: 16px; justify-content: center; margin-top: 6px; font-size: 0.75rem; }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.back-link { position: fixed; top: 20px; left: 20px; z-index: 10; color: #5a6a80; text-decoration: none; font-size: 0.85rem; padding: 6px 14px; border: 1px solid #1e2940; border-radius: 8px; transition: 0.2s; background: rgba(10,14,23,0.8); backdrop-filter: blur(4px); }
.back-link:hover { border-color: #3b4b6b; color: #e0e6ed; }
</style>
<script type="importmap">
{ "imports": {
    "three": "../../vendor/three/three.module.js",
    "three/addons/": "../../vendor/three/addons/"
} }
</script>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; All Scenes</a>
<div id="canvas-wrap" style="width:100vw;height:100vh"></div>
<div class="scene-info">
  <h2>TCP Three-Way Handshake</h2>
  <p>Client <span style="color:#60a5fa">SYN</span> &rarr; Server <span style="color:#34d399">SYN-ACK</span> &rarr; Client <span style="color:#fbbf24">ACK</span></p>
  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:#60a5fa"></span> SYN</span>
    <span class="legend-item"><span class="legend-dot" style="background:#34d399"></span> SYN-ACK</span>
    <span class="legend-item"><span class="legend-dot" style="background:#fbbf24"></span> ACK</span>
    <span class="legend-item"><span class="legend-dot" style="background:#34d399"></span> Established</span>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, wrap.clientWidth / wrap.clientHeight, 0.1, 50);
camera.position.set(0, 4, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
wrap.appendChild(renderer.domElement);

scene.background = new THREE.Color(0x0a0e17);
scene.fog = new THREE.Fog(0x0a0e17, 15, 30);

const ambient = new THREE.AmbientLight(0x4466aa, 0.5);
scene.add(ambient);
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(5, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-4, 2, -3);
scene.add(fill);

function makeHost(x, color, label) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 0.8, 0.6),
    new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.6 })
  );
  body.position.y = 0.4;
  group.add(body);
  const screen = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 0.5, 0.05),
    new THREE.MeshStandardMaterial({ color: 0x1a2a4a, emissive: 0x0a1a3a, emissiveIntensity: 0.3 })
  );
  screen.position.set(0, 0.4, 0.33);
  group.add(screen);
  const stand = new THREE.Mesh(
    new THREE.BoxGeometry(0.1, 0.3, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x2a3a5a })
  );
  stand.position.y = -0.15;
  group.add(stand);
  group.position.x = x;
  scene.add(group);
  return group;
}

const client = makeHost(-4.5, 0x3b82f6, 'Client');
const server = makeHost(4.5, 0x8b5cf6, 'Server');

const connectionLine = new THREE.Mesh(
  new THREE.PlaneGeometry(9, 0.04),
  new THREE.MeshBasicMaterial({ color: 0x1e2940, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
);
connectionLine.rotation.x = -Math.PI / 2;
connectionLine.position.y = 0.2;
scene.add(connectionLine);

const pulseLine = new THREE.Mesh(
  new THREE.PlaneGeometry(0.1, 0.02),
  new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.0, side: THREE.DoubleSide })
);
pulseLine.rotation.x = -Math.PI / 2;

function makePacket(color, label) {
  const group = new THREE.Group();
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 16, 16),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.3, roughness: 0.2, metalness: 0.1 })
  );
  group.add(sphere);
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 12, 12),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.15 })
  );
  group.add(glow);
  return group;
}

const syn = makePacket(0x60a5fa);
const synAck = makePacket(0x34d399);
const ack = makePacket(0xfbbf24);
const established = makePacket(0x34d399);

const packets = [syn, synAck, ack];

function resetPackets() {
  syn.position.set(-4.5, 0.2, 0);
  syn.visible = true;
  synAck.position.set(4.5, 0.2, 0);
  synAck.visible = false;
  ack.position.set(-4.5, 0.2, 0);
  ack.visible = false;
  established.position.set(0, 0.2, 0);
  established.visible = false;
  scene.add(syn);
  scene.add(synAck);
  scene.add(ack);
  scene.add(established);
}

resetPackets();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 20;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0, 0.3, 0);

let resumeTimeout = null;
controls.addEventListener('start', () => {
  controls.autoRotate = false;
  clearTimeout(resumeTimeout);
});
controls.addEventListener('end', () => {
  resumeTimeout = setTimeout(() => { controls.autoRotate = true; }, 3000);
});

let clock = new THREE.Clock();
let phase = 0;
let phaseTime = 0;

function animatePacket(packet, fromX, toX, t) {
  const p = Math.min(Math.max(t, 0), 1);
  packet.position.x = fromX + (toX - fromX) * p;
  const bounce = Math.sin(p * Math.PI) * 0.15;
  packet.position.y = 0.2 + bounce;
  packet.scale.setScalar(1 + Math.sin(p * Math.PI * 2) * 0.08);
}

function updatePhase(delta) {
  phaseTime += delta;
  const travelDuration = 2.0;
  const pauseDuration = 0.8;

  if (phase === 0) {
    const t = phaseTime / travelDuration;
    if (t >= 1) {
      syn.visible = true;
      phase = 1;
      phaseTime = 0;
    } else {
      animatePacket(syn, -4.5, 4.5, t);
      synAck.visible = false;
      ack.visible = false;
      established.visible = false;
    }
  } else if (phase === 1) {
    if (phaseTime < pauseDuration) {
      syn.position.set(4.5, 0.2, 0);
      syn.material.color.setHex(0x3b82f6);
    } else {
      const t = (phaseTime - pauseDuration) / travelDuration;
      if (t >= 1) {
        synAck.visible = true;
        phase = 2;
        phaseTime = 0;
      } else {
        animatePacket(synAck, 4.5, -4.5, t);
        synAck.visible = true;
      }
    }
  } else if (phase === 2) {
    if (phaseTime < pauseDuration) {
      synAck.position.set(-4.5, 0.2, 0);
    } else {
      const t = (phaseTime - pauseDuration) / travelDuration;
      if (t >= 1) {
        ack.visible = true;
        phase = 3;
        phaseTime = 0;
      } else {
        animatePacket(ack, -4.5, 4.5, t);
        ack.visible = true;
      }
    }
  } else if (phase === 3) {
    if (phaseTime < pauseDuration) {
      ack.position.set(4.5, 0.2, 0);
    } else {
      const t = (phaseTime - pauseDuration) / travelDuration;
      if (t >= 1) {
        phase = 4;
        phaseTime = 0;
      } else {
        animatePacket(ack, 4.5, -4.5, t);
      }
    }
  } else if (phase === 4) {
    syn.visible = false;
    synAck.visible = false;
    ack.visible = false;
    established.visible = true;
    established.position.set(0, 0.2, 0);
    established.scale.setScalar(1 + Math.sin(phaseTime * 2) * 0.05);

    const connGlow = connectionLine.material;
    connGlow.color.setHex(0x34d399);
    connGlow.opacity = 0.6 + Math.sin(phaseTime * 2) * 0.2;

    if (phaseTime > 3.0) {
      phase = 0;
      phaseTime = 0;
      syn.visible = true;
      synAck.visible = false;
      ack.visible = false;
      established.visible = false;
      syn.position.set(-4.5, 0.2, 0);
      synAck.position.set(4.5, 0.2, 0);
      ack.position.set(-4.5, 0.2, 0);
      connectionLine.material.color.setHex(0x1e2940);
      connectionLine.material.opacity = 0.3;
    }
  }
}

let rafId = null;
function animate() {
  rafId = requestAnimationFrame(animate);
  const delta = clock.getDelta();
  updatePhase(delta);
  controls.update();
  renderer.render(scene, camera);
}

new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting && rafId === null) { clock = new THREE.Clock(); animate(); }
    else if (!e.isIntersecting && rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
  });
}, { threshold: 0.1 }).observe(wrap);

new ResizeObserver(() => {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}).observe(wrap);

animate();
</script>
</body>
</html>
