<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICMP Ping — TCP/IP Illustrated 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e17; color: #e0e6ed; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
.scene-info { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(15,22,41,0.92); border: 1px solid #1e2940; border-radius: 14px; padding: 14px 24px; text-align: center; z-index: 10; max-width: 500px; backdrop-filter: blur(8px); }
.scene-info h2 { font-size: 1rem; font-weight: 600; color: #34d399; }
.scene-info p { font-size: 0.8rem; color: #8899b0; margin-top: 2px; }
.scene-info .legend { display: flex; gap: 14px; justify-content: center; margin-top: 6px; font-size: 0.72rem; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.back-link { position: fixed; top: 20px; left: 20px; z-index: 10; color: #5a6a80; text-decoration: none; font-size: 0.85rem; padding: 6px 14px; border: 1px solid #1e2940; border-radius: 8px; transition: 0.2s; background: rgba(10,14,23,0.8); backdrop-filter: blur(4px); }
.back-link:hover { border-color: #3b4b6b; color: #e0e6ed; }
</style>
<script type="importmap">
{ "imports": {
    "three": "../../vendor/three/three.module.js",
    "three/addons/": "../../vendor/three/addons/"
} }
</script>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; All Scenes</a>
<div id="canvas-wrap" style="width:100vw;height:100vh"></div>
<div class="scene-info">
  <h2>ICMP Ping (Echo)</h2>
  <p>Echo Request &rarr; Destination processes &rarr; Echo Reply &rarr; RTT measured</p>
  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:#60a5fa"></span> Echo Request</span>
    <span class="legend-item"><span class="legend-dot" style="background:#34d399"></span> Echo Reply</span>
    <span class="legend-item"><span class="legend-dot" style="background:#fbbf24"></span> RTT Counter</span>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, wrap.clientWidth / wrap.clientHeight, 0.1, 50);
camera.position.set(0, 4, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
wrap.appendChild(renderer.domElement);

scene.background = new THREE.Color(0x0a0e17);
scene.fog = new THREE.Fog(0x0a0e17, 15, 30);

const ambient = new THREE.AmbientLight(0x4466aa, 0.5);
scene.add(ambient);
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(5, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-4, 2, -3);
scene.add(fill);

function makeHost(x, color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.0, 0.7, 0.5),
    new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.6, emissive: color, emissiveIntensity: 0.05 })
  );
  body.position.y = 0.35;
  g.add(body);
  const screen = new THREE.Mesh(
    new THREE.BoxGeometry(0.7, 0.4, 0.04),
    new THREE.MeshStandardMaterial({ color: 0x1a2a4a, emissive: 0x0a1a3a, emissiveIntensity: 0.3 })
  );
  screen.position.set(0, 0.35, 0.27);
  g.add(screen);
  const stand = new THREE.Mesh(
    new THREE.BoxGeometry(0.06, 0.2, 0.06),
    new THREE.MeshStandardMaterial({ color: 0x2a3a5a })
  );
  stand.position.y = -0.12;
  g.add(stand);
  g.position.x = x;
  scene.add(g);
  return g;
}

const client = makeHost(-5, 0x3b82f6);
const server = makeHost(5, 0x34d399);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 0.5),
  new THREE.MeshBasicMaterial({ color: 0x0f1629, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.1;
scene.add(ground);

const connLine = new THREE.Mesh(
  new THREE.PlaneGeometry(9, 0.025),
  new THREE.MeshBasicMaterial({ color: 0x1e2940, transparent: true, opacity: 0.2, side: THREE.DoubleSide })
);
connLine.rotation.x = -Math.PI / 2;
connLine.position.y = 0.05;
scene.add(connLine);

function makePingPacket(color) {
  const g = new THREE.Group();
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.18, 12, 12),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4, roughness: 0.2 })
  );
  g.add(core);
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(0.26, 10, 10),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.1 })
  );
  g.add(glow);
  return g;
}

const request = makePingPacket(0x60a5fa);
const reply = makePingPacket(0x34d399);
[request, reply].forEach(p => { p.visible = false; scene.add(p); });

const rttMeter = new THREE.Mesh(
  new THREE.PlaneGeometry(2.5, 0.06),
  new THREE.MeshBasicMaterial({ color: 0x1e2940, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
);
rttMeter.rotation.x = -Math.PI / 2;
rttMeter.position.set(0, -0.05, 0);
scene.add(rttMeter);

const rttFill = new THREE.Mesh(
  new THREE.PlaneGeometry(0, 0.04),
  new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.6, side: THREE.DoubleSide })
);
rttFill.rotation.x = -Math.PI / 2;
rttFill.position.set(-1.25, -0.04, 0);
scene.add(rttFill);

const pingCount = 5;
const pingMarkers = [];
for (let i = 0; i < pingCount; i++) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.04, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0x5a6a80, transparent: true, opacity: 0.3 })
  );
  m.position.set(-1.25 + (i / (pingCount - 1)) * 2.5, -0.04, 0);
  scene.add(m);
  pingMarkers.push(m);
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 20;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.target.set(0, 0.3, 0);

let resumeTimeout = null;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(resumeTimeout); });
controls.addEventListener('end', () => { resumeTimeout = setTimeout(() => { controls.autoRotate = true; }, 3000); });

const seq = [
  { pkt: request, from: -5, to: 5, label: 'Req 1' },
  { pkt: reply, from: 5, to: -5, label: 'Reply 1' },
  { pkt: request, from: -5, to: 5, label: 'Req 2' },
  { pkt: reply, from: 5, to: -5, label: 'Reply 2' },
  { pkt: request, from: -5, to: 5, label: 'Req 3' },
  { pkt: reply, from: 5, to: -5, label: 'Reply 3' },
  { pkt: request, from: -5, to: 5, label: 'Req 4' },
  { pkt: reply, from: 5, to: -5, label: 'Reply 4' },
  { pkt: request, from: -5, to: 5, label: 'Req 5' },
  { pkt: reply, from: 5, to: -5, label: 'Reply 5' },
];

let clock = new THREE.Clock();
let step = 0;
let stepTime = 0;
const dur = 0.9;
const gap = 0.4;

function easeInOut(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  stepTime += delta;

  if (step >= seq.length) {
    step = 0;
    stepTime = 0;
    return;
  }

  const s = seq[step];

  if (stepTime < dur) {
    const t = stepTime / dur;
    s.pkt.visible = true;
    s.pkt.position.x = s.from + (s.to - s.from) * easeInOut(t);
    s.pkt.position.y = 0.2 + Math.sin(t * Math.PI) * 0.3;
    s.pkt.scale.setScalar(1 + Math.sin(t * Math.PI * 3) * 0.08);
  } else {
    s.pkt.visible = false;
    if (stepTime >= dur + gap) {
      step++;
      stepTime = 0;
    }
  }

  const pingIdx = Math.min(Math.floor(step / 2), pingCount - 1);
  const fillWidth = (pingIdx / (pingCount - 1)) * 2.5;
  rttFill.geometry.dispose();
  rttFill.geometry = new THREE.PlaneGeometry(fillWidth, 0.04);

  pingMarkers.forEach((m, i) => {
    m.material.opacity = i <= pingIdx ? 0.6 : 0.15;
    m.material.color.setHex(i <= pingIdx ? 0x34d399 : 0x5a6a80);
  });

  controls.update();
  renderer.render(scene, camera);
}

new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { clock = new THREE.Clock(); animate(); } });
}, { threshold: 0.1 }).observe(wrap);

new ResizeObserver(() => {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}).observe(wrap);
</script>
</body>
</html>
