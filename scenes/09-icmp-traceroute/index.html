<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICMP Traceroute — TCP/IP Illustrated 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e17; color: #e0e6ed; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
.scene-info { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(15,22,41,0.92); border: 1px solid #1e2940; border-radius: 14px; padding: 14px 24px; text-align: center; z-index: 10; max-width: 540px; backdrop-filter: blur(8px); }
.scene-info h2 { font-size: 1rem; font-weight: 600; color: #f97316; }
.scene-info p { font-size: 0.8rem; color: #8899b0; margin-top: 2px; }
.scene-info .legend { display: flex; gap: 12px; justify-content: center; margin-top: 6px; font-size: 0.72rem; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.back-link { position: fixed; top: 20px; left: 20px; z-index: 10; color: #5a6a80; text-decoration: none; font-size: 0.85rem; padding: 6px 14px; border: 1px solid #1e2940; border-radius: 8px; transition: 0.2s; background: rgba(10,14,23,0.8); backdrop-filter: blur(4px); }
.back-link:hover { border-color: #3b4b6b; color: #e0e6ed; }
</style>
<script type="importmap">
{ "imports": {
    "three": "../../vendor/three/three.module.js",
    "three/addons/": "../../vendor/three/addons/"
} }
</script>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; All Scenes</a>
<div id="canvas-wrap" style="width:100vw;height:100vh"></div>
<div class="scene-info">
  <h2>ICMP Traceroute</h2>
  <p>TTL=1 &rarr; Hop 1 replies &middot; TTL=2 &rarr; Hop 2 replies &middot; TTL=3 &rarr; Destination!</p>
  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:#60a5fa"></span> Probe (TTL=n)</span>
    <span class="legend-item"><span class="legend-dot" style="background:#ef4444"></span> ICMP TTL Exceeded</span>
    <span class="legend-item"><span class="legend-dot" style="background:#34d399"></span> ICMP Echo Reply</span>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, wrap.clientWidth / wrap.clientHeight, 0.1, 50);
camera.position.set(1, 4, 12);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
wrap.appendChild(renderer.domElement);

scene.background = new THREE.Color(0x0a0e17);
scene.fog = new THREE.Fog(0x0a0e17, 18, 35);

const ambient = new THREE.AmbientLight(0x4466aa, 0.5);
scene.add(ambient);
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(5, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-4, 2, -3);
scene.add(fill);

const sourceColor = 0x3b82f6;
const routerColor = 0xef4444;
const destColor = 0x34d399;

const nodeDefs = [
  { label: 'Source', x: -7, z: 0, color: sourceColor },
  { label: 'Router 1', x: -3.5, z: -1.2, color: routerColor },
  { label: 'Router 2', x: 0, z: 0.8, color: routerColor },
  { label: 'Router 3', x: 3.5, z: -1.2, color: routerColor },
  { label: 'Dest', x: 7, z: 0, color: destColor },
];

function makeNode(def) {
  const g = new THREE.Group();
  const isRouter = def.color === routerColor;
  const geo = isRouter ? new THREE.OctahedronGeometry(0.55) : new THREE.BoxGeometry(0.9, 0.65, 0.5);
  const body = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: def.color, roughness: 0.3, metalness: 0.5,
    emissive: def.color, emissiveIntensity: 0.05
  }));
  g.add(body);
  if (!isRouter) {
    const screen = new THREE.Mesh(
      new THREE.BoxGeometry(0.6, 0.35, 0.04),
      new THREE.MeshStandardMaterial({ color: 0x1a2a4a, emissive: 0x0a1a3a, emissiveIntensity: 0.3 })
    );
    screen.position.set(0, 0, 0.27);
    g.add(screen);
    const stand = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.05, 0.2, 6),
      new THREE.MeshStandardMaterial({ color: 0x2a3a5a })
    );
    stand.position.y = -0.42;
    g.add(stand);
  } else {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.6, 0.04, 12, 20),
      new THREE.MeshStandardMaterial({ color: def.color, emissive: def.color, emissiveIntensity: 0.1, transparent: true, opacity: 0.3 })
    );
    ring.rotation.x = Math.PI / 2;
    g.add(ring);
  }
  g.position.set(def.x, 0, def.z);
  scene.add(g);
  return g;
}

const nodeMeshes = nodeDefs.map(makeNode);

for (let i = 0; i < nodeDefs.length - 1; i++) {
  const a = nodeDefs[i], b = nodeDefs[i + 1];
  const dx = b.x - a.x, dz = b.z - a.z;
  const len = Math.sqrt(dx * dx + dz * dz);
  const midX = (a.x + b.x) / 2, midZ = (a.z + b.z) / 2;
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(len - 0.6, 0.025),
    new THREE.MeshBasicMaterial({ color: 0x1e2940, transparent: true, opacity: 0.2, side: THREE.DoubleSide })
  );
  line.rotation.x = -Math.PI / 2;
  line.position.set(midX, 0.02, midZ);
  line.rotation.z = -Math.atan2(dz, dx);
  scene.add(line);
}

function makePacket(color) {
  const g = new THREE.Group();
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 10, 10),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.5, roughness: 0.2, metalness: 0.1 })
  );
  g.add(core);
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(0.24, 8, 8),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.12 })
  );
  g.add(glow);
  return g;
}

const probe = makePacket(0x60a5fa);
const ttlExceeded = makePacket(0xef4444);
const echoReply = makePacket(0x34d399);
[probe, ttlExceeded, echoReply].forEach(p => { p.visible = false; scene.add(p); });

const hops = [
  { from: 0, to: 1, ttl: 1 },
  { from: 0, to: 1, to: 2, ttl: 2 },
  { from: 0, to: 1, to: 2, to: 3, to: 4, ttl: 3 },
];

let routeHop = [
  { from: 0, to: 1 },  { from: 1, to: 0 },
  { from: 0, to: 1 },  { from: 1, to: 2 },  { from: 2, to: 1 },
  { from: 0, to: 1 },  { from: 1, to: 2 },  { from: 2, to: 3 },  { from: 3, to: 4 },  { from: 4, to: 0, last: true },
];

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 5;
controls.maxDistance = 25;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.target.set(0, 0, 0);

let resumeTimeout = null;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(resumeTimeout); });
controls.addEventListener('end', () => { resumeTimeout = setTimeout(() => { controls.autoRotate = true; }, 3000); });

let clock = new THREE.Clock();
let step = 0;
let stepTime = 0;
const dur = 1.6;
const pause = 0.7;

function easeInOut(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

function getPos(idx) { return new THREE.Vector3(nodeDefs[idx].x, 0.15, nodeDefs[idx].z); }

function getPacket(stepIdx) {
  const seg = routeHop[stepIdx];
  if (!seg) return probe;
  if (seg.last) return echoReply;
  if (seg.from < seg.to) return probe;
  return ttlExceeded;
}

function updateScene(delta) {
  stepTime += delta;
  if (step >= routeHop.length) { step = 0; stepTime = 0; return; }

  const seg = routeHop[step];
  const pkt = getPacket(step);

  if (stepTime < dur) {
    const t = stepTime / dur;
    const from = getPos(seg.from);
    const to = getPos(seg.to);
    const pos = new THREE.Vector3().copy(from).lerp(to, easeInOut(t));
    pos.y += Math.sin(t * Math.PI) * 0.35;
    pkt.position.copy(pos);
    pkt.visible = true;
    pkt.scale.setScalar(1 + Math.sin(t * Math.PI * 3) * 0.08);
  } else {
    pkt.visible = seg.last && step === routeHop.length - 1;
    if (stepTime >= dur + pause) {
      pkt.visible = false;
      step++;
      stepTime = 0;
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  updateScene(Math.min(clock.getDelta(), 0.05));
  controls.update();
  renderer.render(scene, camera);
}

new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { clock = new THREE.Clock(); animate(); } });
}, { threshold: 0.1 }).observe(wrap);

new ResizeObserver(() => {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}).observe(wrap);
</script>
</body>
</html>
